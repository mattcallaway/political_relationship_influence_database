[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "political_relationship_influence_database"
version = "0.1.0"
description = "Sonoma Political Relationship and Influence Database"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<6.0",
    "djangorestframework>=3.14.0",
    "psycopg>=3.1.0",
    "openpyxl>=3.1.0",
    "PyMuPDF>=1.23.0",
    "pypdf>=4.0.0",
    "pydantic>=2.0.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
