{% extends 'base.html' %}

{% block title %}{% if expenditure %}Edit{% else %}Create{% endif %} Expenditure - Sonoma Civic Platform{% endblock %}

{% block content %}
<div style="margin-bottom:1.5rem;">
    <a href="{% url 'expenditure_list' %}" class="btn btn-secondary" style="font-size:0.85rem;">&larr; Back to Ledger</a>
</div>

<div class="card" style="max-width:800px; margin:0 auto; padding:2rem;">
    <h2 style="font-family:'Outfit', sans-serif; font-weight:700; color:#fff; border-bottom:1px solid var(--border-color); padding-bottom:0.75rem; margin-bottom:1.5rem;">
        {% if expenditure %}Edit{% else %}Record Manual{% endif %} Campaign Expenditure
    </h2>

    <form method="post" style="display:flex; flex-direction:column; gap:1.25rem;">
        {% csrf_token %}

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.25rem;">
            <div>
                <label style="display:block; font-size:0.8rem; color:var(--text-muted); margin-bottom:0.25rem; font-weight:600;">FILER COMMITTEE (REQUIRED)</label>
                <select name="filer_committee" required style="width:100%; padding:0.6rem; border-radius:4px; border:1px solid var(--border-color); background:var(--bg-primary); color:#fff;">
                    <option value="">-- Select Filer --</option>
                    {% for ent in entities %}
                    <option value="{{ ent.id }}" {% if expenditure and expenditure.filer_committee_id == ent.id %}selected{% endif %}>{{ ent.canonical_name }} ({{ ent.public_id }})</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label style="display:block; font-size:0.8rem; color:var(--text-muted); margin-bottom:0.25rem; font-weight:600;">PAYEE CANONICAL ENTITY (OPTIONAL)</label>
                <select name="payee_entity" style="width:100%; padding:0.6rem; border-radius:4px; border:1px solid var(--border-color); background:var(--bg-primary); color:#fff;">
                    <option value="">-- Select Payee --</option>
                    {% for ent in entities %}
                    <option value="{{ ent.id }}" {% if expenditure and expenditure.payee_entity_id == ent.id %}selected{% endif %}>{{ ent.canonical_name }} ({{ ent.public_id }})</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.25rem;">
            <div>
                <label style="display:block; font-size:0.8rem; color:var(--text-muted); margin-bottom:0.25rem; font-weight:600;">PAYEE RAW NAME (IF NOT LINKED)</label>
                <input type="text" name="payee_raw_name" value="{{ expenditure.payee_raw_name|default:'' }}" placeholder="e.g. Muelrath Public Affairs" style="width:100%; padding:0.6rem; border-radius:4px; border:1px solid var(--border-color); background:var(--bg-primary); color:#fff;">
            </div>

            <div>
                <label style="display:block; font-size:0.8rem; color:var(--text-muted); margin-bottom:0.25rem; font-weight:600;">EXPENDITURE AMOUNT (REQUIRED)</label>
                <input type="number" step="0.01" name="amount" value="{{ expenditure.amount|default:'' }}" required placeholder="0.00" style="width:100%; padding:0.6rem; border-radius:4px; border:1px solid var(--border-color); background:var(--bg-primary); color:#fff;">
            </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.25rem;">
            <div>
                <label style="display:block; font-size:0.8rem; color:var(--text-muted); margin-bottom:0.25rem; font-weight:600;">TRANSACTION DATE (REQUIRED)</label>
                <input type="date" name="transaction_date" value="{{ expenditure.transaction_date|date:'Y-m-d'|default:'' }}" required style="width:100%; padding:0.6rem; border-radius:4px; border:1px solid var(--border-color); background:var(--bg-primary); color:#fff;">
            </div>

            <div>
                <label style="display:block; font-size:0.8rem; color:var(--text-muted); margin-bottom:0.25rem; font-weight:600;">EXPENDITURE CODE (e.g. CNS, CMP)</label>
                <input type="text" name="transaction_code" value="{{ expenditure.transaction_code|default:'' }}" placeholder="CNS" style="width:100%; padding:0.6rem; border-radius:4px; border:1px solid var(--border-color); background:var(--bg-primary); color:#fff;">
            </div>
        </div>

        <div>
            <label style="display:block; font-size:0.8rem; color:var(--text-muted); margin-bottom:0.25rem; font-weight:600;">SOURCE DOCUMENT PROVENANCE</label>
            <select name="source" style="width:100%; padding:0.6rem; border-radius:4px; border:1px solid var(--border-color); background:var(--bg-primary); color:#fff;">
                <option value="">-- Select Source Document --</option>
                {% for src in sources %}
                <option value="{{ src.id }}" {% if expenditure and expenditure.source_id == src.id %}selected{% endif %}>{{ src.title }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label style="display:block; font-size:0.8rem; color:var(--text-muted); margin-bottom:0.25rem; font-weight:600;">DESCRIPTION / EXPLANATION</label>
            <textarea name="description" rows="4" placeholder="Purpose of this expenditure..." style="width:100%; padding:0.6rem; border-radius:4px; border:1px solid var(--border-color); background:var(--bg-primary); color:#fff;">{{ expenditure.description|default:'' }}</textarea>
        </div>

        <button type="submit" class="btn" style="padding:0.75rem; font-size:0.95rem; font-weight:600; margin-top:0.5rem;">
            {% if expenditure %}Save Changes{% else %}Record Manual Expenditure{% endif %}
        </button>
    </form>
</div>
{% endblock %}
